rule:
  id: "ai-go-hardcoded-secret"
  language: "go"
  confidence: "HIGH"
  message: "Hardcoded secret detected. AI generated code often leaves placeholder tokens or passwords."
  explanation: "AI coding assistants frequently insert mock API keys or credentials directly in source files. Developers often forget to move these into environment variables, risking exposure in version control."
  query: >
    [
      (const_spec
        name: (identifier) @name
        value: (expression_list (string_literal) @val)
        (#match? @name "(?i)(secret|password|api_key|token|private_key)")
        (#not-match? @val "^`+$|^`+\\s*`+$|^\"+$|^\"+\\s*\"+$")
      )
      (var_spec
        name: (identifier) @name
        value: (expression_list (string_literal) @val)
        (#match? @name "(?i)(secret|password|api_key|token|private_key)")
        (#not-match? @val "^`+$|^`+\\s*`+$|^\"+$|^\"+\\s*\"+$")
      )
      (short_var_declaration
        left: (expression_list (identifier) @name)
        right: (expression_list (string_literal) @val)
        (#match? @name "(?i)(secret|password|api_key|token|private_key)")
        (#not-match? @val "^`+$|^`+\\s*`+$|^\"+$|^\"+\\s*\"+$")
      )
    ]
